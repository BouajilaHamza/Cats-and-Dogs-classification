data:
  train_path: "data/raw/train"
  test_path: "data/raw/test"
  batch_size: 32
  num_workers: 4

model:
  name: "resnet50"
  num_classes: 2
  pretrained: true
  learning_rate: 0.001

training:
  epochs: 10
  device: "cuda"
  save_dir: "models"

mlflow:
  tracking_uri: "./mlflow"
  experiment_name: "cats-dogs-classification"
