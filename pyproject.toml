[project]
name = "cats-dogs-classifier"
version = "0.1.0"
description = "Cats and Dogs Image Classification Project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "pandas>=2.2.3",
    "pillow>=11.1.0",
    "keras>=3.8.0",
    "comet-ml>=3.49.0",
    "tensorflow>=2.18.0",
    "fastapi>=0.115.8",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "uvicorn>=0.34.0",
    "gunicorn>=23.0.0",
    "python-decouple>=3.8",
    "aiohttp>=3.11.12",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.4",
]

