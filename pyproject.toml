[project]
name = "cats-dogs-classifier"
version = "0.1.0"
description = "Cats and Dogs Image Classification Project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlflow>=2.20.1",
    "hydra-core>=1.3.2",
    "pandas>=2.2.3",
    "numpy>=2.2.2",
    "pillow>=11.1.0",
    "keras>=3.8.0",
    "comet-ml>=3.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
]

